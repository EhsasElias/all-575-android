# Include inside the HTTPS server block. Review the API/image hosts before enabling.
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
# Inline styles are required by Leaflet. Inline scripts and eval remain prohibited.
# Add only contracted image/CDN/payment SDK hosts when those integrations are implemented.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.market575.com https://tile.openstreetmap.org; connect-src 'self' https://api.market575.com; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

# config.js/index.html contain release configuration; never reuse stale copies after deployment.
expires off;
add_header Cache-Control "no-store" always;
