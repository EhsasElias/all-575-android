name: Independent QA regression

on:
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Execute test cases independently of formatting, so a Prettier failure cannot hide test defects.
      - name: Unit and component regression (Vitest)
        run: npm test

  build-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API contract
        run: npm run api:check
      - name: TypeScript and production build
        run: npm run build

  lint-autofix-once:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/qa-regression-20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply only ESLint's supported safe automated fixes
        run: |
          set +e
          npm run lint -- --fix > /tmp/qa-lint.txt 2>&1
          status=$?
          set -e
          tail -n 35 /tmp/qa-lint.txt
          echo "Autofix exit code: $status; remaining findings are not ignored by CI."
          npm run format > /tmp/qa-format.txt 2>&1
          tail -n 5 /tmp/qa-format.txt
      - name: Commit only automated fixes to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No safe fixes remain."
          else
            git commit -m "Apply ESLint safe auto-fixes on frontend"
            git push origin HEAD:refs/heads/fix/qa-regression-20261119
          fi
