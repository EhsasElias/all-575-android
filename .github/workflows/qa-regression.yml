name: Independent QA regression

on:
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Execute test cases independently of formatting, so a Prettier failure cannot hide test defects.
      - name: Unit and component regression (Vitest)
        run: npm test

  build-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit remaining untranslated screen copy
        run: npm run locales:audit
      - name: API contract
        run: npm run api:check
      - name: TypeScript and production build
        run: npm run build

  format-review-files:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/qa-regression-20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the 14 reviewed files only
        run: npx prettier --write e2e/responsive-locales.spec.ts scripts/locale-audit.mjs src/app/i18n-coverage.test.ts src/app/layout/AccountSidebar.tsx src/app/layout/DashboardSidebar.tsx src/features/account/adminAssignmentsFrench.ts src/features/account/courierFrench.ts src/features/account/CourierWorkspaceScreen.tsx src/features/account/SellerApplicationScreen.tsx src/features/account/sellerFinanceFrench.ts src/features/account/sellerInsightFrench.ts src/features/account/SellerInsightPanel.tsx src/features/account/sellerReturnsFrench.ts src/features/account/sellerStaffFrench.ts
      - name: Commit formatting to QA review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Already correctly formatted."
          else
            git commit -m "Format reviewed localization and responsiveness changes"
            git push origin HEAD:refs/heads/fix/qa-regression-20261119
          fi
