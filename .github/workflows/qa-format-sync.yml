name: One-time QA code formatting
on:
  push:
    branches: [fix/dashboard-sidebar-navigation-20261123]
    paths:
      - '.github/workflows/qa-format-sync.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'EhsasElias/all-575-android'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fix Prettier formatting in previously reported files
        run: |
          npx prettier --write \
            src/app/layout/AccountSidebar.module.css \
            src/app/layout/AccountSidebar.tsx \
            src/app/layout/DashboardSidebar.tsx \
            src/features/account/CourierWorkspaceScreen.module.css \
            src/features/account/CourierWorkspaceScreen.tsx \
            src/features/account/roleApplicationsApi.ts \
            src/features/account/RoleApplicationScreen.module.css \
            src/features/account/RoleApplicationScreen.tsx \
            src/features/account/SellerReviewScreen.tsx \
            src/features/account/SuperAdminRoleApplications.tsx \
            src/features/account/PlatformAdminAssignments.tsx \
            src/features/catalog/home/HomeSection.module.css \
            src/features/catalog/home/PopularProducts.tsx
      - name: Save formatting only on QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/layout/AccountSidebar.module.css src/app/layout/AccountSidebar.tsx src/app/layout/DashboardSidebar.tsx src/features/account/CourierWorkspaceScreen.module.css src/features/account/CourierWorkspaceScreen.tsx src/features/account/roleApplicationsApi.ts src/features/account/RoleApplicationScreen.module.css src/features/account/RoleApplicationScreen.tsx src/features/account/SellerReviewScreen.tsx src/features/account/SuperAdminRoleApplications.tsx src/features/account/PlatformAdminAssignments.tsx src/features/catalog/home/HomeSection.module.css src/features/catalog/home/PopularProducts.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format QA frontend files without changing behavior"
            git push origin HEAD:fix/dashboard-sidebar-navigation-20261123
          fi
